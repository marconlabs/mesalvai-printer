# Release do Mesalvaí Printer: tag v* → binários Windows (.exe) e Mac
# (universal: .zip + .dmg) + checksums.txt no GitHub Release. O programa
# instalado atualiza sozinho lendo `releases/latest` e conferindo o sha256.
#
# Segredos (Settings › Secrets › Actions) — todos OPCIONAIS:
#   MAC_CERT_P12, MAC_CERT_PASSWORD  → certificado "Developer ID Application" (base64 do .p12)
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD → notarização (notarytool)
# Sem eles: Mac sai sem assinar (Gatekeeper pede "Abrir assim mesmo"; ver README).
# Windows: sem assinatura por enquanto (SmartScreen avisa; docs/assinatura.md).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build windows-amd64
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.versao=${GITHUB_REF_NAME}" \
            -o dist/mesalvai-printer-windows-amd64.exe ./cmd/mesalvai-printer
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/ }
  mac:
    runs-on: macos-14
    # `secrets` não pode entrar no `if` de um passo: vira env no job.
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build darwin universal
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.versao=${GITHUB_REF_NAME}" -o dist/arm64 ./cmd/mesalvai-printer
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.versao=${GITHUB_REF_NAME}" -o dist/amd64 ./cmd/mesalvai-printer
          lipo -create -output dist/mesalvai-printer-darwin-universal dist/arm64 dist/amd64
          rm dist/arm64 dist/amd64
      - name: App bundle
        run: |
          APP="dist/Mesalvaí Printer.app"
          mkdir -p "$APP/Contents/MacOS"
          cp dist/mesalvai-printer-darwin-universal "$APP/Contents/MacOS/mesalvai-printer"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Mesalvaí Printer</string>
            <key>CFBundleDisplayName</key><string>Mesalvaí Printer</string>
            <key>CFBundleIdentifier</key><string>br.com.mesalvai.printer</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key><string>mesalvai-printer</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSUIElement</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
      - name: Assinar e notarizar (só com os segredos)
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          codesign --force --options runtime --timestamp --sign "Developer ID Application" "dist/Mesalvaí Printer.app"
          codesign --force --options runtime --timestamp --sign "Developer ID Application" dist/mesalvai-printer-darwin-universal
          ditto -c -k --keepParent "dist/Mesalvaí Printer.app" dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Mesalvaí Printer.app"
          rm dist/notarize.zip cert.p12
      - name: zip + dmg
        run: |
          cd dist
          ditto -c -k --keepParent "Mesalvaí Printer.app" mesalvai-printer-mac.zip
          hdiutil create -volname "Mesalvaí Printer" -srcfolder "Mesalvaí Printer.app" -ov -format UDZO mesalvai-printer-mac.dmg
          rm -rf "Mesalvaí Printer.app"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/ }
  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
